apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: hana-proxy-test
  annotations:
    scenarios.ai.sap.com/name: "hana-proxy-test"
    executables.ai.sap.com/name: "hana-proxy-test"
    executables.ai.sap.com/description: "HANA via connectivity_proxy WebSocket tunnel"
  labels:
    scenarios.ai.sap.com/id: "hana-proxy-test"
    ai.sap.com/version: "0.0.1"
spec:
  entrypoint: main
  templates:
    - name: main
      metadata:
        labels:
          ai.sap.com/resourcePlan: starter
      container:
        image: balagik/hana-proxy-test:latest
        imagePullPolicy: Always
        command: ["python", "/app/hana_connect_aicore.py"]
        env:
          - name: CONN_SVC_URL
            value: "https://connectivity.cf.us10.hana.ondemand.com"
          - name: CONN_TUNNEL_PATH
            value: "/api/v1/tunnel"
          - name: CONN_TOKEN_URL
            value: "https://wppkp2jrxgmvt0pf.authentication.us10.hana.ondemand.com/oauth/token"
          - name: CONN_CLIENT_ID
            value: "sb-clone6ff5ea12b74543b99ef618dcbd25acf9!b658828|connectivity!b7"
          - name: CONN_CLIENT_SECRET
            value: "233e4af4-1faf-4e2e-adda-fe058c551666$HpqcmBmEV1lmbQJP9m1MKOw7RiS2szn297QtDgg143c="
          - name: CONN_SUBACCOUNT_ID
            value: "a2cc6dce-e6c9-42d2-b4aa-26be5a4c22ad"
          - name: CONN_SUBDOMAIN
            value: "wppkp2jrxgmvt0pf"
          - name: HANA_HOST
            value: "s4h-hana-virtual"
          - name: HANA_PORT
            value: "30041"
          - name: HANA_USER
            value: "PLACEHOLDER_USER"
          - name: HANA_PASSWORD
            value: "PLACEHOLDER_PASS"
